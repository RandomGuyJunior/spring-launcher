name: Build Linux Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "src/**"
      - "data/**"
      - "files/**"
      - "bin/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-linux.yml"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Ensure Linux pr-downloader is executable
        run: chmod +x bin/pr-downloader

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run build-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-launcher-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
           
          if-no-files-found: error

      - name: Publish rolling Linux test release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f linux-test
          git push origin -f linux-test
          if gh release view linux-test >/dev/null 2>&1; then
            gh release upload linux-test dist/*.AppImage dist/latest-linux.yml --clobber
            gh release edit linux-test \
              --title "Linux Test Build" \
              --notes "Rolling Linux AppImage test build from master. This release is for testing and may be replaced by newer builds." \
              --prerelease
          else
            gh release create linux-test \
              dist/*.AppImage dist/latest-linux.yml \
              --title "Linux Test Build" \
              --notes "Rolling Linux AppImage test build from master. This release is for testing and may be replaced by newer builds." \
              --prerelease
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
           
