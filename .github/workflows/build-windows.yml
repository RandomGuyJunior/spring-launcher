name: Build Windows Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "src/**"
      - "data/**"
      - "files/**"
      - "bin/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-launcher-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish rolling Windows test release
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f windows-test
          git push origin -f windows-test
          if gh release view windows-test >/dev/null 2>&1; then
            gh release upload windows-test dist/*.exe dist/latest.yml dist/*.blockmap --clobber
            gh release edit windows-test \
              --title "Windows Test Build" \
              --notes "Rolling Windows installer test build from master. This release is for testing and may be replaced by newer builds." \
              --prerelease
          else
            gh release create windows-test \
              dist/*.exe dist/latest.yml dist/*.blockmap \
              --title "Windows Test Build" \
              --notes "Rolling Windows installer test build from master. This release is for testing and may be replaced by newer builds." \
              --prerelease
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
